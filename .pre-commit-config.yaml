repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: maven-checkstyle
        name: Maven Checkstyle
        entry: ./mvnw checkstyle:check -q
        language: script
        files: \.java$
        pass_filenames: false

      - id: maven-spotbugs
        name: Maven SpotBugs
        entry: ./mvnw spotbugs:check -q
        language: script
        files: \.java$
        pass_filenames: false
        stages: [pre-push]

      - id: maven-test
        name: Maven Test
        entry: ./mvnw test -q -DskipITs
        language: script
        files: \.java$
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  skip: [maven-checkstyle, maven-spotbugs, maven-test]
