spring:
  application:
    name: fsamp-gateway
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
      enabled: true

cognito:
  region: ${COGNITO_REGION:us-west-2}
  user-pool-id: ${COGNITO_USER_POOL_ID:}
  client-id: ${COGNITO_CLIENT_ID:}
  resource-server-identifier: ${COGNITO_RESOURCE_SERVER_IDENTIFIER:https://fsamp-local-api}
  client-secret: ${COGNITO_CLIENT_SECRET:}
  jwks-endpoint: ${COGNITO_JWKS_ENDPOINT:}
  issuer-uri: ${COGNITO_ISSUER_URI:}

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:unknown}
      fips_enabled: ${FSAMP_FIPS_ENABLED:${fsamp.security.fips-mode:false}}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1s,2s
  cloudwatch:
    metrics:
      export:
        enabled: false
        namespace: FSAMP/Gateway
        step: 1m

logging:
  level:
    root: INFO
    io.github.pauszek: DEBUG
    software.amazon.awssdk: WARN
  pattern:
    # AU-3: business correlation id plus the Micrometer trace on every line.
    correlation: "[%X{correlationId:-}] [%X{traceId:-}-%X{spanId:-}] "

resilience4j:
  circuitbreaker:
    instances:
      s3Storage:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 10s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
      snsPublisher:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
      dynamoDb:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
  retry:
    instances:
      s3Storage:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        # SI-4: retry only transient AWS/IO failures so programming errors
        # surface instead of hiding behind retries.
        retry-exceptions:
          - io.github.pauszek.fsampgateway.domain.exception.StorageException
          - software.amazon.awssdk.services.s3.model.S3Exception
          - java.io.IOException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
          - io.github.pauszek.fsampgateway.domain.exception.StorageConfigurationException
          - io.github.pauszek.fsampgateway.domain.exception.FileValidationException
      snsPublisher:
        max-attempts: 5
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - io.github.pauszek.fsampgateway.domain.exception.EventPublishException
          - software.amazon.awssdk.services.sns.model.SnsException
          - java.io.IOException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
          - io.github.pauszek.fsampgateway.domain.exception.EventSerializationException
      dynamoDb:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - software.amazon.awssdk.services.dynamodb.model.DynamoDbException
          - java.io.IOException
        ignore-exceptions:
          - software.amazon.awssdk.services.dynamodb.model.ConditionalCheckFailedException
          - java.lang.IllegalArgumentException
  ratelimiter:
    instances:
      fileUpload:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 500ms
        register-health-indicator: true
        event-consumer-buffer-size: 100
      fileDownload:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 100ms
        register-health-indicator: true
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
  bulkhead:
    instances:
      fileUpload:
        max-concurrent-calls: 25
        max-wait-duration: 0ms
security:
  fips:
    approved-only: ${FIPS_APPROVED_ONLY:true}
    provider-position: 1
  cognito:
    allow-group-fallback: false
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    version: 5.32.13
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

storage:
  s3:
    bucket: ${S3_BUCKET_NAME:fsamp-files-local}
    kms-key-id: ${KMS_KEY_ID:alias/fsamp-files-key}
    prefix: uploads/
    presigned-url-expiration: 3600

events:
  sns:
    topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:us-west-2:000000000000:fsamp-local-file-events}
    source: fsamp-gateway

---
spring:
  config:
    activate:
      on-profile: local

cognito:
  region: ${AWS_REGION:us-west-2}
  user-pool-id: ${COGNITO_USER_POOL_ID:local_test_pool}
  client-id: ${COGNITO_CLIENT_ID:local_test_client}
  jwks-endpoint: ${COGNITO_JWKS_ENDPOINT:http://localstack:4566/.well-known/jwks.json}
  issuer-uri: ${COGNITO_ISSUER_URI:http://localstack:4566}

aws:
  region: ${AWS_REGION:us-west-2}
  endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
  credentials:
    access-key: test
    secret-key: test
  s3:
    bucket-name: ${S3_BUCKET_NAME:fsamp-local-files}
    kms-key-id: ${KMS_KEY_ID:alias/fsamp-local-master-key}
  sns:
    file-events-topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:us-west-2:000000000000:fsamp-local-file-events}
  kms:
    key-id: ${KMS_KEY_ID:alias/fsamp-local-master-key}
  dynamodb:
    table-name: ${DYNAMODB_TABLE_NAME:fsamp-local-file-metadata}
    outbox-table-name: ${OUTBOX_TABLE_NAME:fsamp-local-outbox}
    direct-publish-after-outbox: ${DIRECT_PUBLISH_AFTER_OUTBOX:true}
    idempotency-table-name: ${DYNAMODB_IDEMPOTENCY_TABLE_NAME:fsamp-local-idempotency-keys}

fsamp:
  security:
    fips-mode: false
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - application/json
      - text/plain
      - application/xml
    max-file-size-bytes: 104857600  # 100MB
  upload:
    temp-dir: /tmp/fsamp-uploads

security:
  cognito:
    allow-group-fallback: true

