spring:
  config:
    activate:
      on-profile: fips-test
  main:
    lazy-initialization: true
    allow-bean-definition-overriding: true

fsamp:
  security:
    fips-mode: true
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - text/plain
    max-file-size-bytes: 10485760

security:
  fips:
    approved-only: true

cognito:
  region: us-west-2
  user-pool-id: test-pool-id
  client-id: test-client-id
  resource-server-identifier: https://fsamp-test-api
  jwks-endpoint: http://localhost:9999/.well-known/jwks.json
  issuer-uri: https://cognito-idp.us-west-2.amazonaws.com/test-pool

aws:
  region: us-west-2
  endpoint: http://localhost:4566
  fips-endpoints: true
  credentials:
    access-key: test
    secret-key: test
  s3:
    bucket-name: test-bucket
  sns:
    file-events-topic-arn: arn:aws:sns:us-west-2:000000000000:test-topic
  kms:
    key-id: alias/test-key
  dynamodb:
    table-name: test-metadata

logging:
  level:
    root: WARN
    io.github.pauszek: DEBUG
