spring:
  application:
    name: fsamp-gateway-test

aws:
  region: us-west-2
  endpoint: http://localhost:4566
  credentials:
    access-key: test
    secret-key: test
  s3:
    bucket-name: test-bucket
  sns:
    file-events-topic-arn: arn:aws:sns:us-west-2:000000000000:test-file-events
  kms:
    key-id: alias/test-key
  dynamodb:
    table-name: test-metadata

fsamp:
  security:
    fips-mode: false  # Disable FIPS for tests (BouncyCastle might not be available)
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - text/plain
    max-file-size-bytes: 10485760  # 10MB for tests

logging:
  level:
    root: WARN
    io.github.pauszek: DEBUG
