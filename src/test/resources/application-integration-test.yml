spring:
  config:
    activate:
      on-profile: integration-test
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true

cognito:
  region: us-west-2
  user-pool-id: test-pool-id
  client-id: test-client-id
  jwks-endpoint: http://localhost:9999/.well-known/jwks.json
  issuer-uri: https://cognito-idp.us-west-2.amazonaws.com/test-pool

storage:
  s3:
    bucket: fsamp-files-integration
    kms-key-id: alias/test-key
    prefix: integration/

events:
  sns:
    topic-arn: arn:aws:sns:us-west-2:000000000000:fsamp-file-events-integration
    source: integration-test

aws:
  region: us-west-2
  s3:
    bucket-name: fsamp-files-integration
  sns:
    file-events-topic-arn: arn:aws:sns:us-west-2:000000000000:fsamp-file-events-integration
  kms:
    key-id: alias/test-key
  dynamodb:
    table-name: fsamp-idempotency-keys

fsamp:
  security:
    fips-mode: false
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - application/json
      - text/plain
      - application/octet-stream
    max-file-size-bytes: 104857600  # 100MB

resilience4j:
  circuitbreaker:
    instances:
      s3Storage:
        register-health-indicator: false
        sliding-window-size: 5
        failure-rate-threshold: 80
        wait-duration-in-open-state: 5s
        minimum-number-of-calls: 2
      snsPublisher:
        register-health-indicator: false
        sliding-window-size: 5
        failure-rate-threshold: 80
        wait-duration-in-open-state: 5s
        minimum-number-of-calls: 2
  retry:
    instances:
      s3Storage:
        max-attempts: 2
        wait-duration: 100ms
      snsPublisher:
        max-attempts: 2
        wait-duration: 100ms

logging:
  level:
    root: WARN
    io.github.pauszek: DEBUG
    org.testcontainers: INFO
    software.amazon.awssdk: WARN
