# =============================================================================
# CI/CD Parameters for fsamp-gateway
# =============================================================================
# Configuration used by reusable workflows from fsamp-code-ci

ci:
  java-version: "21"
  distribution: corretto

files:
  version: release.version

bump:
  enabled: true
  base-branch: main
  label: autobump

release:
  full-release: true
  publish: true

docker:
  enabled: true
  image-name: fsamp-gateway
  registry: ghcr.io

sonar:
  enabled: true
  organization: pauszek
  project-key: pauszek_fsamp-gateway
