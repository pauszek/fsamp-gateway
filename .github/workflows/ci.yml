name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  call-java:
    uses: pauszek/fsamp-code-ci/.github/workflows/build-java.yml@v0.0.48
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  deploy-dev:
    name: Trigger Dev Deploy
    needs: call-java
    if: >
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.call-java.result == 'success' &&
      vars.AUTO_DEPLOY_DEV == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-infra

      - name: Dispatch dev deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          version="0.0.0"
          [[ -s release.version ]] && version="$(tr -d ' \r\n' < release.version)"
          image_tag="dev-fsamp-gateway-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"

          jq -n \
            --arg gateway_ref "${GITHUB_SHA}" \
            --arg processor_ref "main" \
            --arg image_tag "${image_tag}" \
            --arg service "fsamp-gateway" \
            --arg version "${version}" \
            '{
              event_type: "deploy-dev",
              client_payload: {
                gateway_ref: $gateway_ref,
                processor_ref: $processor_ref,
                image_tag: $image_tag,
                service: $service,
                version: $version
              }
            }' \
            | gh api "repos/${OWNER}/fsamp-infra/dispatches" --method POST --input -
