name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

env:
  CODE_CI_WORKFLOW_SHA: feb5a3a2eec515d5460f4915203652ebf5c86c31

jobs:
  params:
    name: Load Deployment Settings
    runs-on: ubuntu-latest
    outputs:
      auto_deploy_dev: ${{ steps.params.outputs.auto_deploy_dev }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify deployment provenance pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CODE_CI_WORKFLOW_SHA}" =~ ^[a-f0-9]{40}$ ]]
          grep -Fq \
            "uses: pauszek/fsamp-code-ci/.github/workflows/build-java.yml@${CODE_CI_WORKFLOW_SHA}" \
            .github/workflows/ci.yml
          if grep -Eq -- '--arg code_ci_workflow_sha "[a-f0-9]{40}"' .github/workflows/ci.yml; then
            echo "::error::Deployment provenance must use CODE_CI_WORKFLOW_SHA"
            exit 1
          fi

      - name: Load params
        id: params
        shell: bash
        run: |
          auto_deploy_dev="$(python3 - <<'PY'
          from pathlib import Path

          value = "false"
          section = None

          for raw in Path(".github/params.yml").read_text().splitlines():
              line = raw.split("#", 1)[0].rstrip()
              if not line.strip():
                  continue
              if not line.startswith((" ", "\t")) and line.endswith(":"):
                  section = line[:-1].strip()
                  continue
              if section == "deploy":
                  stripped = line.strip()
                  if stripped.startswith("auto-dev:"):
                      value = stripped.split(":", 1)[1].strip().strip("'\"").lower()
                      break

          print("true" if value == "true" else "false")
          PY
          )"
          echo "auto_deploy_dev=${auto_deploy_dev}" >> "$GITHUB_OUTPUT"

  call-java:
    uses: pauszek/fsamp-code-ci/.github/workflows/build-java.yml@feb5a3a2eec515d5460f4915203652ebf5c86c31
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  deploy-dev:
    name: Trigger Dev Deploy
    needs:
      - call-java
      - params
    if: >
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.call-java.result == 'success' &&
      needs.params.outputs.auto_deploy_dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Resolve verified gateway image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < release.version)"
          repository="ghcr.io/${OWNER}/fsamp-gateway"
          echo "${GH_TOKEN}" | crane auth login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          digest="$(crane digest "${repository}:${version}")"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "source=${repository}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GABRBA_APPID }}
          private-key: ${{ secrets.GABRBA_SECRET }}
          repositories: fsamp-infra

      - name: Dispatch dev deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          image_tag="dev-fsamp-gateway-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"

          jq -n \
            --arg gateway_source_image "${{ steps.image.outputs.source }}" \
            --arg code_ci_workflow_sha "${CODE_CI_WORKFLOW_SHA}" \
            --arg image_tag "${image_tag}" \
            '{
              event_type: "deploy-dev",
              client_payload: {
                gateway_source_image: $gateway_source_image,
                code_ci_workflow_sha: $code_ci_workflow_sha,
                image_tag: $image_tag,
                service: "fsamp-gateway"
              }
            }' \
            | gh api "repos/${OWNER}/fsamp-infra/dispatches" --method POST --input -
